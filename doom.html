<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="robots" content="noindex"/>
    <title>DOOM | StarThistle</title>
    <link rel="icon" type="image/png" href="images/logo.png"/>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        .game-player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 640px;
            height: 400px;
            border: 0;
            transform: translate(-50%, -50%) scale(var(--game-scale, 1));
        }

        .fullscreen-button {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            padding: 10px 14px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #000c;
            color: #aaa;
            font: 12px monospace;
            cursor: pointer;
        }

        .fullscreen-button:hover, .fullscreen-button:focus-visible {
            border-color: #fff;
            color: #fff;
        }

        .fullscreen-button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        .fullscreen-status {
            position: fixed;
            top: 58px;
            right: 12px;
            max-width: min(280px, calc(100vw - 24px));
            margin: 0;
            background: #000;
            color: #ccc;
            font: 12px/1.5 monospace;
        }
    </style>
</head>
<body>
    <main aria-label="DOOM game">
        <iframe id="game-player" class="game-player" src="https://archive.org/embed/doom_dos" title="DOOM (MS-DOS) player" width="640" height="400" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </main>
    <button id="fullscreen-button" class="fullscreen-button" type="button" hidden>Full screen</button>
    <p id="fullscreen-status" class="fullscreen-status" role="status"></p>
    <script>
        const player = document.getElementById('game-player');
        const fullscreenButton = document.getElementById('fullscreen-button');
        const fullscreenStatus = document.getElementById('fullscreen-status');

        function fitGame() {
            const scale = Math.min(window.innerWidth / 640, window.innerHeight / 400);
            document.documentElement.style.setProperty('--game-scale', scale);
        }

        fitGame();
        window.addEventListener('resize', fitGame);

        if (document.fullscreenEnabled && document.documentElement.requestFullscreen) {
            fullscreenButton.hidden = false;
            fullscreenButton.addEventListener('click', async () => {
                fullscreenStatus.textContent = '';
                try {
                    if (document.fullscreenElement) {
                        await document.exitFullscreen();
                    } else {
                        await document.documentElement.requestFullscreen();
                    }
                    player.focus();
                } catch {
                    fullscreenStatus.textContent = 'Full screen is unavailable here. Try your browser\'s full screen mode.';
                }
            });
            document.addEventListener('fullscreenchange', () => {
                fullscreenButton.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
                fitGame();
            });
        }
    </script>
</body>
</html>
